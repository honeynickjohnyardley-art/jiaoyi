<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>复盘本 V3 · 纪律与计划复盘</title>
<style>
:root{
  --bg:#E8EBEE;--surface:#F7F8F9;--ink:#18202B;--muted:#65707C;--line:#D3D8DE;--chip:#DFE3E8;
  --gold:#94700F;--a50:#2E5B88;--other:#6B5B95;--up:#1B774B;--down:#B3372E;--focus:#2E5B88;
  --num:"DIN Alternate","Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151A;--surface:#192027;--ink:#E4E8EC;--muted:#8B95A1;--line:#29313B;--chip:#232B34;
  --gold:#D4AC47;--a50:#72A3D8;--other:#A898D0;--up:#4BB783;--down:#E46A5F;--focus:#72A3D8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151A;--surface:#192027;--ink:#E4E8EC;--muted:#8B95A1;--line:#29313B;--chip:#232B34;
  --gold:#D4AC47;--a50:#72A3D8;--other:#A898D0;--up:#4BB783;--down:#E46A5F;--focus:#72A3D8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:
  radial-gradient(circle at 12% -10%,color-mix(in srgb,var(--a50) 10%,transparent),transparent 34%),
  radial-gradient(circle at 92% 0%,color-mix(in srgb,var(--gold) 8%,transparent),transparent 32%),
  var(--bg);color:var(--ink);font:15px/1.6 var(--cjk);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.up{color:var(--up)}.down{color:var(--down)}
.wrap{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:22px 0 72px}

header.top{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:13px 14px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(17,24,39,.05)}
header.top h1{font-size:23px;margin:0;flex:1;letter-spacing:.04em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.btn:hover{border-color:color-mix(in srgb,var(--focus) 45%,var(--line));transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default;transform:none}

.toolbar{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:12px;align-items:stretch}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;min-width:0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 7px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09)}
.seg button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.row2{display:flex;gap:10px;margin:0;align-items:stretch}
.row2 .seg{flex:1}

.overview{display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.7fr);gap:14px;margin-top:14px;align-items:stretch}
#memory,#stats{min-width:0}
/* memory card: the one loud element */
.memory{margin:0;height:100%;min-height:226px;background:var(--ink);color:var(--bg);border-radius:16px;padding:19px 20px 20px;position:relative;overflow:hidden;box-shadow:0 10px 32px rgba(17,24,39,.10)}
.memory::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,color-mix(in srgb,var(--a50) 28%,transparent),transparent 68%);pointer-events:none}
.memory .k{font-size:13px;opacity:.7;letter-spacing:.03em}
.memory .tag{font-size:28px;font-weight:700;line-height:1.25;margin:4px 0 8px;position:relative;z-index:1}
.memory .facts{font-size:14px;opacity:.86;position:relative;z-index:1}
.memory .facts b{font-family:var(--num);font-size:18px;font-weight:600}
.memory blockquote{margin:14px 0 0;padding:12px 0 0;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);font-size:15px;line-height:1.55;position:relative;z-index:1}
.memory blockquote small{display:block;opacity:.6;font-size:12px;margin-top:4px}
.memory.empty .tag{font-size:19px}

#stats{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:none;border:0;border-radius:0;overflow:visible;margin:0}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:72px;box-shadow:0 5px 18px rgba(17,24,39,.035)}
.stats .l{font-size:12px;color:var(--muted);margin-bottom:2px}
.stats .v{font-family:var(--num);font-size:23px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.curve{position:relative;flex:1;min-height:144px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px 12px;overflow:hidden;box-shadow:0 5px 18px rgba(17,24,39,.035)}
.curve-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
.curve-titlebox{display:flex;align-items:baseline;gap:10px;min-width:0}
.curve-title{font-size:13px;font-weight:650;color:var(--ink)}
.curve-hint{font-size:11px;color:var(--muted);white-space:nowrap}
.curve-controls{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.curve-range{min-width:74px;text-align:center;font:12px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.curve-zoom{width:28px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:600 17px/1 var(--num);display:grid;place-items:center}
.curve-zoom:hover{background:var(--chip)}
.curve-zoom:disabled{opacity:.35;cursor:default}
.curve-reset{height:26px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--muted);font-size:11px}
.curve-reset:hover{background:var(--chip);color:var(--ink)}
.curve-plot{position:relative;height:112px;touch-action:pan-y;cursor:crosshair;user-select:none}
.curve-plot.zoomed{cursor:grab}
.curve-plot.dragging{cursor:grabbing}
.curve svg{display:block;width:100%;height:100%;overflow:visible}
.curve-point{fill:var(--surface);stroke:currentColor;stroke-width:1.7;opacity:.58;vector-effect:non-scaling-stroke}
.curve-hover-line{opacity:0;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.curve-hover-dot{opacity:0;fill:var(--surface);stroke:var(--ink);stroke-width:2.3;vector-effect:non-scaling-stroke}
.curve-plot.active .curve-hover-line,.curve-plot.active .curve-hover-dot{opacity:1}
.curve-tooltip{position:absolute;z-index:5;top:0;left:0;min-width:150px;max-width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--surface) 96%,transparent);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.13);font-size:12px;line-height:1.45;pointer-events:none;opacity:0;transform:translate(10px,-46%);transition:opacity .08s ease;backdrop-filter:blur(8px)}
.curve-tooltip.show{opacity:1}
.curve-tooltip.flip{transform:translate(calc(-100% - 10px),-46%)}
.curve-tooltip .ct-main{font-family:var(--num);font-size:17px;font-weight:700;margin-bottom:2px}
.curve-tooltip .ct-sub{color:var(--muted)}
.curve-tooltip .ct-delta{margin-top:3px}
.stats.withcurve{border-radius:0}

.listbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;padding:0 2px}
.listbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.trade-workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.78fr);gap:14px;align-items:start}
.trade-list-pane{min-width:0}
.trade-detail-pane{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(17,24,39,.055)}
.detail-empty{min-height:300px;display:grid;place-items:center;padding:28px;text-align:center;color:var(--muted)}
.detail-empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}
.detail-hero{padding:15px 16px 14px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.detail-hero::after{content:"";position:absolute;width:150px;height:150px;right:-62px;top:-74px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mc) 20%,transparent),transparent 70%);pointer-events:none}
.detail-title{display:flex;align-items:center;gap:7px;padding-right:90px}
.detail-title .mk{font-size:17px}
.detail-title .when{font-size:12px;color:var(--muted)}
.detail-pnl{position:absolute;right:16px;top:13px;font:700 27px/1.1 var(--num);font-variant-numeric:tabular-nums}
.detail-price{font:600 21px/1.3 var(--num);margin-top:10px;position:relative;z-index:1}
.detail-meta{font-size:12px;color:var(--muted);margin-top:4px;position:relative;z-index:1}
.detail-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:5px}
.month{font-size:13px;color:var(--muted);margin:16px 2px 7px;display:flex;justify-content:space-between;align-items:center}
.list{display:flex;flex-direction:column;gap:6px}
.trade{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--mc);border-radius:10px;box-shadow:0 3px 14px rgba(17,24,39,.025);transition:border-color .12s ease,background .12s ease,transform .12s ease}
.trade:hover{border-color:color-mix(in srgb,var(--mc) 34%,var(--line));transform:translateY(-1px)}
.trade.selected{background:color-mix(in srgb,var(--mc) 5%,var(--surface));border-color:color-mix(in srgb,var(--mc) 48%,var(--line));box-shadow:0 5px 18px color-mix(in srgb,var(--mc) 8%,transparent)}
.trade>.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;width:100%;text-align:left;background:none;border:0;padding:10px 12px}
.trade .l1{display:flex;align-items:center;gap:8px;font-size:14px}
.mk{font-weight:700;color:var(--mc)}
.side{font-size:12px;padding:0 6px;border-radius:4px;background:var(--chip)}
.trade .when{color:var(--muted);font-size:13px}
.trade .pnl{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--num);font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.trade .l2{font-size:13px;color:var(--muted)}
.trade .l2 .hd{white-space:nowrap}
.trade .l2 .num{color:var(--ink);font-size:14px}
.trade .tags{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tg{font-size:12px;padding:1px 7px;border-radius:10px;background:var(--chip)}
.tg.bad{background:color-mix(in srgb,var(--down) 14%,var(--surface));color:var(--down)}
.tg.good{background:color-mix(in srgb,var(--up) 14%,var(--surface));color:var(--up)}
.trade .snip{grid-column:1/3;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pending{grid-column:1/3;font-size:12px;color:var(--muted)}
.compact-main{min-width:0}
.compact-top{display:flex;align-items:center;gap:7px;min-width:0}
.compact-top .when{margin-left:auto;white-space:nowrap}
.compact-bottom{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:3px;min-width:0}
.compact-bottom .num{color:var(--ink);font-size:14px}
.compact-bottom .hd{white-space:nowrap}
.compact-tag{margin-left:auto;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-tag.pending{grid-column:auto;font-size:11px}

.ed{border-top:1px dashed var(--line);padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px}
.ed h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:4px 11px;font-size:13px}
.chips button[aria-pressed="true"].bad{background:var(--down);border-color:var(--down);color:#fff}
.chips button[aria-pressed="true"].good{background:var(--up);border-color:var(--up);color:#fff}
.chips button[aria-pressed="true"].cus{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips .add{border-style:dashed;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%}
.field textarea{min-height:76px;resize:vertical;line-height:1.55}
.calc{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;line-height:1.7}
.edfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.hidden{display:none!important}

/* library */
.lib{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.lcard .h{display:flex;align-items:baseline;gap:10px}
.lcard .h .name{font-size:18px;font-weight:700;flex:1}
.lcard .h .cnt{font-family:var(--num);font-size:24px;font-weight:600}
.lcard .meta{font-size:13px;color:var(--muted);margin:2px 0 8px}
.lcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lcard li{font-size:14px;border-left:2px solid var(--line);padding:2px 0 2px 10px}
.lcard li button{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.lcard li .rule{font-weight:600}
.emptybox{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dh{display:flex;align-items:center;padding:14px 16px 0}
.dh h3{margin:0;flex:1;font-size:17px}
.db{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;font-size:14px;color:var(--muted)}
.drop input{display:block;margin:10px auto 0;max-width:100%}
.prev{max-height:40dvh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table{width:100%;border-collapse:collapse;font-size:13px}
.prev td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.prev tr.old td{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--down)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:900px){
  .wrap{width:min(760px,calc(100% - 28px));padding-top:14px}
  .toolbar,.overview{grid-template-columns:1fr}
  .memory{min-height:0}
  .curve-plot{height:120px}
}
@media (min-width:900px){
  #vList .listbar{margin-top:20px}
  .trade-list-pane .month{position:sticky;top:0;z-index:3;margin:0 0 7px;padding:9px 4px 6px;background:linear-gradient(var(--bg) 78%,transparent)}
  .trade-list-pane .month:not(:first-child){margin-top:10px}
  .trade-detail-pane .ed{border-top:0;padding:14px 16px 16px}
  .trade-detail-pane .field textarea{min-height:90px}
}
@media (max-width:899px){
  .trade-workspace{display:block}
  .trade-detail-pane{display:none}
  .trade:hover{transform:none}
}
@media (max-width:620px){
  .wrap{width:calc(100% - 24px);padding-top:12px}
  header.top{flex-wrap:wrap;padding:11px}
  header.top h1{flex:1 0 100%;font-size:21px}
  header.top .btn{flex:1;padding:8px 6px;font-size:13px}
  .toolbar{gap:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .v{font-size:20px}
  .curve{min-height:150px;padding-inline:10px}
  .curve-head{align-items:center}
  .curve-hint{display:none}
  .trade>.sum{padding:10px}
}
@media (max-width:420px){.stats .v{font-size:18px}.stats>div{padding:9px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}


/* startup loading overlay */
.bootload{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);color:var(--ink);transition:opacity .24s ease,visibility .24s ease}
.bootload.done{opacity:0;visibility:hidden;pointer-events:none}
.bootbox{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:220px;padding:24px 28px;text-align:center}
.bootmark{position:relative;width:58px;height:58px}
.bootmark::before,.bootmark::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.bootmark::before{border-top-color:var(--a50);border-right-color:color-mix(in srgb,var(--a50) 35%,transparent);animation:bootspin 1s linear infinite}
.bootmark::after{inset:9px;border-bottom-color:var(--gold);border-left-color:color-mix(in srgb,var(--gold) 35%,transparent);animation:bootspin .72s linear infinite reverse}
.bootdot{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 5px color-mix(in srgb,var(--ink) 9%,transparent)}
.bootname{font-size:20px;font-weight:700;letter-spacing:.08em}
.bootstatus{font-size:13px;color:var(--muted);min-height:21px}
.bootdots::after{content:"";display:inline-block;width:1.5em;text-align:left;animation:bootdots 1.2s steps(4,end) infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
@keyframes bootdots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
@media (prefers-reduced-motion:reduce){.bootload{transition:none}.bootmark::before,.bootmark::after{animation:none}.bootdots::after{animation:none;content:"…"}}


/* V3: evidence-based plan review */
.quality-strip{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--muted)}
.quality-strip b{font-family:var(--num);font-size:14px;color:var(--ink);margin-left:3px}
.quality-strip small{font-size:11px}
.review-pill{font-size:11px;margin-top:4px;color:var(--muted)}
.review-pill.complete{color:var(--up)}
.review-pill.partial{color:var(--gold)}
.review-part{border:1px solid var(--line);border-radius:10px;padding:10px;background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.review-part h4{margin:0 0 8px;font-size:13px;font-weight:650;color:var(--ink)}
.review-part .field input{min-width:0}
.review-part .calc{margin:7px 0 0;line-height:1.8;background:var(--surface);border:1px solid var(--line)}
.verified-line{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink);margin-top:12px;cursor:pointer}
.verified-line input{accent-color:var(--a50);margin-top:3px;flex:0 0 auto}
.plan-result{margin-top:8px;padding:9px 11px;border-left:3px solid var(--a50);background:color-mix(in srgb,var(--a50) 8%,var(--surface));border-radius:4px}
.plan-result small{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.execution-chips [aria-pressed="true"]{background:var(--a50)!important;border-color:var(--a50)!important;color:#fff!important}
@media(max-width:620px){.quality-strip{display:grid;grid-template-columns:1fr 1fr;gap:7px}.review-part{padding:9px}}
.tz-badge{display:inline-block;font-size:10px;line-height:1.4;padding:1px 4px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-weight:400;white-space:nowrap}

/* Simplified right-hand review panel. */
.trade-detail-pane .simple-review{gap:16px;padding:18px 16px}
.simple-review .review-part{border:0;border-radius:0;padding:0;background:none}
.simple-review .review-part h4{color:var(--ink);font-size:14px;font-weight:600;margin-bottom:9px}
.simple-review .field{gap:6px;color:var(--ink)}
.trade-detail-pane .simple-review textarea{min-height:70px;font-size:14px}
.simple-review .chips button{border-radius:6px;padding:6px 9px}
.simple-review .review-fold{border-top:1px solid var(--line);padding-top:13px}
.simple-review summary{cursor:pointer;color:var(--muted);font-size:14px;line-height:1.6}
.simple-review summary:hover,.simple-review details[open]>summary{color:var(--ink)}
.simple-review summary:focus-visible{outline:2px solid var(--a50);outline-offset:4px}

.simple-review .fold-body .note{line-height:1.65}

.simple-review .edfoot .btn{font-size:12px;padding:4px 0}

<body>

<div class="wrap">
  <header class="top">
    <h1>复盘本</h1>
    <button class="btn" id="bBindData" title="选择或创建复盘数据.json，之后每次修改都会自动写入">授权数据文件</button>
    <button class="btn" id="bAdd">手动添加</button>
    <button class="btn primary" id="bImport">导入记录</button>
    <button class="btn" id="bExportHTML" title="把当前交易与备注打包成独立 HTML 文件，单文件可查看">下载含数据HTML</button>
  </header>

  <div class="toolbar">
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <div class="seg" id="mkSeg" role="group" aria-label="品种"></div>
      <div class="seg" id="sideSeg" role="group" aria-label="交易方向">
        <button data-side="ALL" aria-pressed="true">全部方向</button>
        <button data-side="long" aria-pressed="false">做多</button>
        <button data-side="short" aria-pressed="false">做空</button>
      </div>
    </div>
    <div class="row2">
      <div class="seg" id="viewSeg" role="group" aria-label="视图">
        <button data-v="list" aria-pressed="true">交易记录</button>
        <button data-v="lib" aria-pressed="false">错误库</button>
      </div>
    </div>
  </div>

  <div class="overview">
    <section id="memory"></section>
    <section id="stats"></section>
  </div>

    <p class="note">时间口径：全部统一为北京时间；排序、月度分组、曲线及持仓时长均按北京时间计算。嘉盛和手工选择洛杉矶的时间自动换算，来源时间留底。</p>

  <section id="vList">
    <div class="listbar">
      <label><input type="checkbox" id="onlyTodo"> 只看未完成复盘的</label>
      <span class="note" id="saveState"></span>
    </div>
    <div id="list"></div>
  </section>
  <section id="vLib" class="hidden"><div class="lib" id="lib"></div></section>

  <p class="note" style="margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span id="modeNote"></span>
    <span id="fileState" style="font-weight:600" class="note "></span>
    <button class="btn ghost hidden" id="bSaveData">立即保存</button>
    <button class="btn ghost hidden" id="bExport">导出备份</button>
  <button id="bMarketCheck" class="btn">重新检查历史品种分类</button></p>
</div>

<dialog id="dImport">
  <div class="dh"><h3>导入交易记录</h3><button class="btn ghost" data-close="">关闭</button></div>
  <div class="db">
    <div class="drop">
      嘉盛交易历史（xlsx/csv）、MT5 历史报告（xlsx，含持仓/订单/成交），或复盘本备份（json）
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv,.json">
    </div>
    <div class="note">重复导入没关系：已经在复盘本里的交易会自动跳过，备注不会被覆盖。</div>
    <div id="impOut"></div>
  </div>
</dialog>

<dialog id="dAdd">
  <div class="dh"><h3>手动添加一笔</h3><button class="btn ghost" data-close="">关闭</button></div>
  <form class="db" id="addForm" onsubmit="return false">
    <div class="two">
      <label class="field">品种<select name="market"><option value="XAU">黄金 XAU/USD</option><option value="A50">A50</option></select></label>
      <label class="field">方向<select name="side"><option value="long">做多</option><option value="short">做空</option></select></label>
      <label class="field">时间所属时区<select name="tz"><option value="北京">北京</option><option value="洛杉矶">洛杉矶（保存时转北京）</option></select></label>
      <label class="field">开仓时间<input type="datetime-local" name="ot" step="1" required=""></label>
      <label class="field">平仓时间<input type="datetime-local" name="ct" step="1" required=""></label>
      <label class="field">开仓价<input type="number" step="any" name="op" inputmode="decimal" required=""></label>
      <label class="field">平仓价<input type="number" step="any" name="cp" inputmode="decimal" required=""></label>
      <label class="field">手数<input type="number" step="any" name="qty" value="1" inputmode="decimal"></label>
      <label class="field">盈亏（留空按点差×手数算）<input type="number" step="any" name="pnl" inputmode="decimal"></label>
    </div>
    <div class="err" id="addErr"></div>
    <button class="btn primary" id="addGo" type="button">添加这笔交易</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

    const sc=document.createElement("script");

  // Derive possible offsets from Intl on both sides of any DST transition.
  const offsets=new Set([-2,-1,0,1,2].map(days=>{const ms=wall+days*86400000;return Date.parse(zoneWall(ms,zone).replace(' ','T')+'Z')-ms}));
  const matches=[...offsets].map(offset=>wall-offset).filter(ms=>zoneWall(ms,zone)===value);
  if(matches.length!==1)throw new Error('来源时间处于夏令时重复或不存在时段，请核实：'+value+' '+zone);
  return zoneWall(matches[0],'Asia/Shanghai');
}

async function commitMarketChanges(changes,source){
  const before=new Map(S.trades),next=new Map(S.trades);
  for(const c of changes){if(!same(before.get(c.id),c.before))return {stale:true};next.set(c.id,{...c.before,market:c.market,marketName:c.marketName})}
  if(next.size!==before.size||!same([...next.keys()],[...before.keys()]))throw new Error("交易集合校验失败");
  for(const [id,t] of before){const n=next.get(id),c=changes.find(x=>x.id===id);if(!same(t.note,n.note)||!same(n,c?{...t,market:c.market,marketName:c.marketName}:t))throw new Error("交易字段校验失败")}
  const record={source,at:new Date().toISOString(),changes:changes.map(c=>({id:c.id,from:{market:c.before.market,marketName:c.before.marketName},to:{market:c.market,marketName:c.marketName}}))};
  const backup={app:"fupan",version:2,exportedAt:record.at,trades:[...before].map(([id,t])=>({id,...t})),migration:record,boundFileSnapshot:boundOriginal};
  try{localStorage.setItem("fupan-market-backup-"+Date.now(),JSON.stringify(backup));downloadMarketBackup(backup)}catch(e){toast("独立备份失败，未修改交易");return {ok:false}}

  render();return {ok:true};

async function checkMarketMigration(){
  if(marketChecking)return false;
  marketChecking=true;marketPause++;clearTimeout(S.fileSaveTimer);
  let result=true,patched=false;
  try{for(;;){const hit=inspectMarketFix();if(!hit)break;
    if(hit.conflict){boundMarketBlocked=!!boundOriginal?.some(t=>t.id===FIX_ID&&t.market!==hit.t.market);toast("历史分类冲突：50175598 的分类或 MT5 资料已改变，未自动修改；请在单笔编辑中核对");break}
    const before=JSON.parse(JSON.stringify(hit.t));
    if(!await marketConfirm(marketPreview(FIX_ID,before,"USTECH100CFD","US Tech 100 CFD"))){boundMarketBlocked=!!boundOriginal;break}
    const r=await commitMarketChanges([{id:FIX_ID,before,market:"USTECH100CFD",marketName:"US Tech 100 CFD"}],MARKET_FIX);
    if(r.stale){toast("数据已变化，请重新确认预览");continue}result=r.ok;patched=r.ok;boundMarketBlocked=!r.ok;break;
  }
    if(result&&!inspectMarketFix()&&boundOriginal){
      const fileMap=new Map(boundOriginal.map(({id,...t})=>[id,t])),hit=inspectMarketFix(fileMap);
      if(hit){
        if(hit.conflict){boundMarketBlocked=true;toast("绑定文件有分类冲突，已暂停回写，请核对文件后重新绑定")}
        else if(S.trades.get(FIX_ID)?.market==="USTECH100CFD"){
          // The local patch backup already includes the original bound file.
          if(patched){boundMarketBlocked=false;boundOriginal=null}
          else if(await marketConfirm("绑定文件中的历史错误：<br>"+marketPreview(FIX_ID,hit.t,"USTECH100CFD","US Tech 100 CFD"))){
            if(inspectMarketFix()){boundMarketBlocked=true;toast("数据已变化，请重新检查历史分类");return false}
            try{const backup={app:"fupan",trades:boundOriginal,migration:{source:MARKET_FIX,target:"bound-file",at:new Date().toISOString(),changes:[{id:FIX_ID,from:{market:hit.t.market,marketName:hit.t.marketName},to:{market:"USTECH100CFD",marketName:"US Tech 100 CFD"}}]}};localStorage.setItem("fupan-market-backup-file-"+Date.now(),JSON.stringify(backup));downloadMarketBackup(backup);boundMarketBlocked=false;boundOriginal=null}catch(e){boundMarketBlocked=true;result=false;toast("绑定文件独立备份失败，未回写")}
          }else boundMarketBlocked=true;
        }
      }
    }
  }finally{marketPause--;marketChecking=false}

}

/* ---------- derived ---------- */
const pts=t=>t.side==="long"?t.closePrice-t.openPrice:t.openPrice-t.closePrice;
const perPt=t=>{const p=pts(t);return Math.abs(p)>1e-9?t.pnl/p:(t.qty||1)};
// Merge legacy note fields for display and subsequent saves; keep embedded data intact.
const noteOf=t=>{
  const n={...emptyNote(),...(t.note||{})};
  n.text=[n.text,n.lesson].filter(v=>v!=="").join("\n\n");
  n.lesson="";
  return n;
};
/* ---------- original-plan comparison: intentionally conservative ---------- */
const numOrNull=v=>(v==null||v==="")?null:(Number.isFinite(+v)?+v:null);
function planned(t,n){
  const tp=numOrNull(n.tp),sl=numOrNull(n.sl),risk=numOrNull(n.riskAmount);
  const sign=t.side==="long"?1:-1;
  const targetDist=tp==null?null:(tp-t.openPrice)*sign;
  const stopDist=sl==null?null:(t.openPrice-sl)*sign;
  const validPrices=targetDist!=null&&stopDist!=null&&targetDist>0&&stopDist>0;
  const amountOK=risk!=null&&risk>0;
  const result={tp,sl,risk,targetDist,stopDist,validPrices,amountOK,
    ratio:validPrices?targetDist/stopDist:null,
    actualR:amountOK?t.pnl/risk:null,
    status:"pending",hypothetical:null,delta:null};
  // A first-touch result requires BOTH intended exit prices, a positive risk amount,
  // and explicit manual verification of the subsequent price path.
  if(validPrices&&amountOK&&n.afterVerified===true&&(n.after==="tp"||n.after==="sl")){
    result.status="confirmed_by_user";
    result.hypothetical=n.after==="tp"?risk*result.ratio:-risk;
    result.delta=t.pnl-result.hypothetical;
  }
  return result;
}
const reviewed=t=>{const n=noteOf(t);return !!(n.tags.length||n.text.trim()||n.lesson.trim()||n.tp!=null||n.sl!=null||n.riskAmount!=null||n.execution||n.after||n.afterVerified)};
function reviewState(t){
  const n=noteOf(t),p=planned(t,n);
  if(p.validPrices&&p.amountOK&&(n.execution==="follow"||n.execution==="violate"))return "complete";
  return reviewed(t)?"partial":"none";
}
const reviewLabel=t=>({complete:"复盘完整",partial:"部分复盘",none:"未复盘"})[reviewState(t)];
const execLabel=v=>({follow:"按计划执行",violate:"偏离计划",unknown:"待确认"})[v]||"未评价";

function filtered(){
  let a=[...S.trades.entries()].map(([id,t])=>({id,...withTradeTz(t)}));
  if(S.mk!=="ALL")a=a.filter(t=>t.market===S.mk);
  if(S.side!=="ALL")a=a.filter(t=>t.side===S.side);
  return a.sort((x,y)=>y.openTime<x.openTime?-1:1);
}
const fmtP=(v,dp)=>isFinite(v)?Number(v).toFixed(dp):"—";
const fmtPnl=v=>(v>0?"+":v<0?"−":"")+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:2});
const cls=v=>v>0?"up":v<0?"down":"";
function hold(a,b){
  const ms=new Date(b.replace(" ","T"))-new Date(a.replace(" ","T"));if(!(ms>=0))return"";
  const m=Math.round(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);
  return d?`${d}天${h%24?h%24+"小时":""}`:h?`${h}小时`:`${m}分钟`;
}

function tagStats(list){
  const m=new Map();
  for(const t of list){const n=noteOf(t);for(const g of n.tags){
    if(!m.has(g))m.set(g,{tag:g,trades:[],pnl:0,verified:0,toTp:0,toSl:0});
    const s=m.get(g);s.trades.push(t);s.pnl+=t.pnl;
    if(g===EARLY_TP&&planned(t,n).status==="confirmed_by_user"){
      s.verified++;if(n.after==="tp")s.toTp++;if(n.after==="sl")s.toSl++;
    }
  }}
  return [...m.values()].sort((a,b)=>b.trades.length-a.trades.length||a.pnl-b.pnl);
}

  const confirmed=list.filter(t=>planned(t,noteOf(t)).status==="confirmed_by_user").length;
  const eq=[...list].sort((a,b)=>a.closeTime<b.closeTime?-1:1);let c=0;
  const curvePts=[{value:0,delta:0,label:"起点",market:"",side:""},...eq.map(t=>({value:(c+=t.pnl),delta:t.pnl,label:md(t.closeTime),market:mkInfo(t.market).name,side:t.side==="long"?"做多":"做空"}))];
  $("#stats").innerHTML=`<div class="stats ${n>1?"withcurve":""}">
    <div><div class="l">总盈亏</div><div class="v ${cls(tot)}">${n?fmtPnl(tot):"—"}</div></div>
    <div><div class="l">胜率</div><div class="v">${n?Math.round(w.length/n*100)+"%":"—"}</div></div>
    <div><div class="l">盈亏比</div><div class="v">${aw&&al?(aw/al).toFixed(2):"—"}</div></div>
    <div><div class="l">复盘完整</div><div class="v">${rv}/${n}</div></div></div>
    <div class="quality-strip">
      <span>纪律执行 <b>${assessed.length?Math.round(follows/assessed.length*100)+"%":"—"}</b> <small>（${follows}/${assessed.length} 笔已评价）</small></span>
      <span>已填初始风险 <b>${withRisk.length}/${n}</b></span>
      <span>平均实际 R <b>${avgR==null?"—":(avgR>0?"+":"")+avgR.toFixed(2)+"R"}</b> <small>（仅${withRisk.length}笔）</small></span>
      <span>计划结果已核对 <b>${confirmed}</b> 笔</span>

function spark(points){
  return `<div class="curve-head"><div class="curve-titlebox"><span class="curve-title">累计盈亏曲线</span><span class="curve-hint">悬停看数值 · 放大后可拖动平移</span></div><div class="curve-controls" aria-label="资金曲线缩放"><button type="button" class="curve-zoom" data-curve-out title="缩小" aria-label="缩小">−</button><span class="curve-range" data-curve-range>全部</span><button type="button" class="curve-zoom" data-curve-in title="放大" aria-label="放大">＋</button><button type="button" class="curve-reset" data-curve-reset title="显示全部">全部</button></div></div>
    <div class="curve-plot" data-curve="${esc(JSON.stringify(points))}">
      <svg viewBox="0 0 900 112" preserveAspectRatio="none" role="img" aria-label="累计盈亏曲线"></svg><div class="curve-tooltip"></div>
    </div>`;
}
function bindCurveHover(){
  const box=document.querySelector(".curve-plot");if(!box)return;
  let points;try{points=JSON.parse(box.dataset.curve||"[]")}catch(e){return}if(points.length<2)return;
  const svg=box.querySelector("svg"),tip=box.querySelector(".curve-tooltip"),rangeEl=box.closest(".curve")?.querySelector("[data-curve-range]"),btnIn=box.closest(".curve")?.querySelector("[data-curve-in]"),btnOut=box.closest(".curve")?.querySelector("[data-curve-out]"),btnReset=box.closest(".curve")?.querySelector("[data-curve-reset]");
  const W=900,H=112,P=7,total=points.length;
  let start=0,end=total,hoverGlobal=null,drag=null;
  if(S.curveView&&S.curveView.key===S.mk&&S.curveView.total===total){start=Math.max(0,Math.min(total-2,S.curveView.start|0));end=Math.max(start+2,Math.min(total,S.curveView.end|0))}
  const persist=()=>{S.curveView={key:S.mk,total,start,end}};
  const fmtRange=()=>{const shown=end-start;if(shown>=total)return "全部";const a=points[start]?.label||"",b=points[end-1]?.label||"";return `${shown}/${total} · ${a.replace(/\s.*$/,'')}–${b.replace(/\s.*$/,'')}`};
  const hideTip=()=>{tip.classList.remove("show");box.classList.remove("active")};
  const draw=()=>{
    const visible=points.slice(start,end),v=visible.map(p=>p.value),mn=Math.min(...v,0),mx=Math.max(...v,0),r=mx-mn||1;
    const x=i=>visible.length===1?W/2:i/(visible.length-1)*W,y=val=>H-P-(val-mn)/r*(H-P*2);
    const d=v.map((val,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(val).toFixed(1)}`).join("");
    const area=`M0,${H-P} ${d.replace(/^M/,"L")} L${W},${H-P} Z`;
    const last=points[points.length-1].value,lineColor=last>=0?"var(--up)":"var(--down)";
    const grid=[mn+(mx-mn)*.25,mn+(mx-mn)*.5,mn+(mx-mn)*.75].map(g=>`<line x1="0" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" opacity=".42" stroke-dasharray="2 6" vector-effect="non-scaling-stroke"/>`).join("");
    const dots=v.map((val,i)=>`<circle class="curve-point" cx="${x(i).toFixed(1)}" cy="${y(val).toFixed(1)}" r="2.7" style="color:${lineColor}"/>`).join("");
    svg.innerHTML=`<defs><linearGradient id="curveArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lineColor}" stop-opacity=".18"/><stop offset="1" stop-color="${lineColor}" stop-opacity="0"/></linearGradient></defs>${grid}<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/><path d="${area}" fill="url(#curveArea)"/><path d="${d}" fill="none" stroke="${lineColor}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>${dots}<line class="curve-hover-line" x1="0" x2="0" y1="0" y2="${H}"/><circle class="curve-hover-dot" cx="0" cy="0" r="4.3"/>`;
    box.dataset.min=mn;box.dataset.max=mx;box.classList.toggle("zoomed",end-start<total);if(rangeEl)rangeEl.textContent=fmtRange();if(btnOut)btnOut.disabled=end-start>=total;if(btnIn)btnIn.disabled=end-start<=4;hideTip();persist();
  };
  const clampWindow=(newStart,count)=>{count=Math.max(4,Math.min(total,count));newStart=Math.max(0,Math.min(total-count,newStart));start=newStart;end=newStart+count;draw()};
  const zoom=(dir,focusGlobal=null)=>{
    const count=end-start;if(dir>0&&count<=4)return;if(dir<0&&count>=total)return;
    const next=dir>0?Math.max(4,Math.round(count*.68)):Math.min(total,Math.ceil(count/0.68));
    const focus=focusGlobal==null?(start+end-1)/2:focusGlobal,ratio=count>1?(focus-start)/(count-1):.5;
    clampWindow(Math.round(focus-ratio*(next-1)),next);
  };
  const show=e=>{
    if(drag)return;
    const rect=box.getBoundingClientRect(),visibleCount=end-start,rel=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    const local=Math.max(0,Math.min(visibleCount-1,Math.round(rel*(visibleCount-1)))),i=start+local,p=points[i];hoverGlobal=i;
    const mn=+box.dataset.min,mx=+box.dataset.max,r=mx-mn||1,sy=val=>H-P-(val-mn)/r*(H-P*2),cx=visibleCount===1?W/2:local/(visibleCount-1)*W,cy=sy(p.value),px=cx/W*rect.width,py=cy/H*rect.height;
    const line=svg.querySelector(".curve-hover-line"),dot=svg.querySelector(".curve-hover-dot");if(!line||!dot)return;
    line.setAttribute("x1",cx);line.setAttribute("x2",cx);dot.setAttribute("cx",cx);dot.setAttribute("cy",cy);
    tip.innerHTML=`<div class="ct-main ${cls(p.value)}">${fmtPnl(p.value)}</div><div class="ct-sub">${esc(p.label)}${p.market?` · ${esc(p.market)} ${esc(p.side)}`:""}</div>${i?`<div class="ct-delta">本笔 <span class="num ${cls(p.delta)}">${fmtPnl(p.delta)}</span></div>`:""}`;
    tip.style.left=px+"px";tip.style.top=py+"px";tip.classList.toggle("flip",px>rect.width*.72);tip.classList.add("show");box.classList.add("active");
  };
  if(btnIn)btnIn.onclick=()=>zoom(1,hoverGlobal);if(btnOut)btnOut.onclick=()=>zoom(-1,hoverGlobal);if(btnReset)btnReset.onclick=()=>{start=0;end=total;draw()};
  box.onpointermove=e=>{if(drag){const rect=box.getBoundingClientRect(),count=drag.end-drag.start,shift=Math.round((drag.x-e.clientX)/rect.width*Math.max(1,count-1));if(shift!==drag.lastShift){drag.lastShift=shift;const ns=Math.max(0,Math.min(total-count,drag.start+shift));start=ns;end=ns+count;draw()}return}show(e)};
  box.onpointerenter=show;box.onpointerleave=()=>{if(!drag)hideTip()};
  box.onpointerdown=e=>{if(end-start>=total||e.button!==0)return;drag={x:e.clientX,start,end,lastShift:0};box.classList.add("dragging");hideTip();try{box.setPointerCapture(e.pointerId)}catch(_){};e.preventDefault()};
  box.onpointerup=e=>{if(!drag)return;drag=null;box.classList.remove("dragging");try{box.releasePointerCapture(e.pointerId)}catch(_){};persist();show(e)};
  box.onpointercancel=()=>{drag=null;box.classList.remove("dragging");hideTip()};
  box.ondblclick=()=>{start=0;end=total;draw()};
  draw();
}

function parseTime(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())} ${pad(v.getHours())}:${pad(v.getMinutes())}:${pad(v.getSeconds())}`;

}

function parseBroker(aoa){

/* ---------- MT5 XLSX: closed positions, orders and deals ---------- */
// 来源：LV 于 2026-10-23 确认该服务器夏令时为 UTC+3；旧嘉盛记录由独立 Intl 迁移转北京；MT5 单独转北京时间 UTC+8。
// 服务器夏令时（美国规则）：每年 3 月第二个周日 02:00 至 11 月第一个周日 02:00 为夏令时，表中偏移为夏令时偏移，冬令时为该值减 1。
// 2026 年切换日：夏令时开始 3 月 8 日，结束 11 月 1 日。11 月 1 日之后的交易此前被误按 +5 小时换算，正确为 +6 小时。
const MT5_SERVER_UTC_OFFSETS={"FOREX.comGlobalCN-Live 534":3};
const MT5_BEIJING_UTC_OFFSET=8; // 夏令时转换偏移 = 8 - 3 = +5 小时；冬令时 = 8 - 2 = +6 小时
function nthSundayOfMonth(year,month0,n){const first=new Date(Date.UTC(year,month0,1));return 1+((7-first.getUTCDay())%7)+(n-1)*7}
function mt5ServerOffset(server,raw){
  const dst=MT5_SERVER_UTC_OFFSETS[server];
  if(!Number.isFinite(dst))return NaN;
  const m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/.exec(raw||"");
  if(!m)return dst;
  const y=+m[1],mo=+m[2],d=+m[3],h=+m[4];
  const startDay=nthSundayOfMonth(y,2,2),endDay=nthSundayOfMonth(y,10,1);
  const afterStart=mo>3||(mo===3&&(d>startDay||(d===startDay&&h>=2)));
  const beforeEnd=mo<11||(mo===11&&(d<endDay||(d===endDay&&h<2)));
  return (afterStart&&beforeEnd)?dst:dst-1;
}
// 修复已入库的 MT5 交易时间：2026-11-01 夏令时切换后，旧版仍按 +5 小时换算，导致 11 月交易显示早 1 小时。
// 仅重算经纪商原始时间派生的 openTime/closeTime 与偏移字段，不动任何复盘笔记与计划字段；已正确的交易不动；每次启动自检，幂等。
function repairMt5DstTimes(){
  let fixed=0;
  const toBj=(raw,off)=>{const d=new Date(raw.replace(" ","T")+"Z");if(!Number.isFinite(+d))return null;return new Date(+d+(MT5_BEIJING_UTC_OFFSET-off)*3600000).toISOString().slice(0,19).replace("T"," ")};
  for(const t of S.trades.values()){
    const m=t&&t.mt5;
    if(!m||!m.open_time_raw)continue;
    const openOff=mt5ServerOffset(m.server,m.open_time_raw);
    if(!Number.isFinite(openOff)||m.server_utc_offset===openOff)continue;
    const nt=toBj(m.open_time_raw,openOff);
    if(!nt)continue;
    t.openTime=nt;
    if(m.close_time_raw){
      const closeOff=mt5ServerOffset(m.server,m.close_time_raw);
      const ct=toBj(m.close_time_raw,closeOff);
      if(ct)t.closeTime=ct;
    }
    m.server_utc_offset=openOff;
    m.beijing_offset_hours=MT5_BEIJING_UTC_OFFSET-openOff;
    fixed++;
  }
  if(fixed)lsSave();
  return fixed;
}

  const trading=deals.filter(d=>/^(buy|sell)$/i.test(str(d.type)));
  const eq=(a,b)=>toNum(a)!=null&&toNum(b)!=null&&Math.abs(toNum(a)-toNum(b))<1e-8;
  const candidates=positions.map(p=>({p,entry:trading.filter(d=>str(d.entry)==='in'&&str(d.order)===str(p.id)&&str(d.symbol)===str(p.symbol)&&str(d.type)===str(p.type)&&parseTime(d.time)===parseTime(p.time)&&eq(d.qty,p.qty)&&eq(d.price,p.price)),exit:trading.filter(d=>str(d.entry)==='out'&&str(d.symbol)===str(p.symbol)&&str(d.type)===(str(p.type)==='buy'?'sell':'buy')&&parseTime(d.time)===parseTime(p.closeTime)&&eq(d.qty,p.qty)&&eq(d.price,p.closePrice))}));
  const counts=new Map();for(const c of candidates)for(const d of [...c.entry,...c.exit])counts.set(d,(counts.get(d)||0)+1);
  const rows=[],warnings=[],seen=new Set();
  for(const {p,entry,exit} of candidates){
    const id=ticket(p.id);
    const skip=reason=>warnings.push('持仓 '+id+' 未导入：'+reason);
    if(seen.has(id)){fail('持仓号重复（可能部分平仓），请导出含 DEAL_POSITION_ID 的完整明细')}seen.add(id);
    if(!parseTime(p.closeTime)||bj(p.closeTime)<bj(p.time)||!(toNum(p.qty)>0)||!/^(buy|sell)$/.test(str(p.type))){skip('不是完整有效的已平仓交易');continue}
    if(entry.length!==1||exit.length!==1||counts.get(entry[0])!==1||counts.get(exit[0])!==1){skip('成交无法唯一匹配，拆单/部分平仓需 DEAL_POSITION_ID');continue}
    const ds=[entry[0],exit[0]],os=ds.map(d=>orders.filter(o=>str(o.id)===str(d.order)&&str(o.symbol)===str(p.symbol)&&str(o.type)===str(d.type)));
    if(os.some(a=>a.length!==1)||trading.some(d=>ds.some(x=>str(x.order)===str(d.order))&&!ds.includes(d))){skip('订单缺失、重复或存在拆分成交');continue}
    const sum=k=>ds.reduce((s,d)=>{const n=toNum(d[k]);if(n==null)fail('持仓 '+id+' 缺少费用/盈利 '+k);return s+n},0);
    const grossPnl=sum('profit'),commission=sum('commission'),fee=sum('fee'),swap=sum('swap');
    if(!eq(grossPnl,p.profit)||!eq(commission,p.commission)||!eq(swap,p.swap)){skip('持仓与成交的盈亏/费用核对不一致');continue}
    const comment=str(os[0][0].comment)||str(entry[0].comment),ea=MT5_EA_COMMENT.test(comment);
    const plan=v=>toNum(v)>0?toNum(v):null;
    rows.push({id:'MT5:'+encodeURIComponent(server)+':'+account+':'+id,body:{market:marketCode(p.symbol),marketName:str(p.symbol),side:str(p.type)==='buy'?'long':'short',qty:toNum(p.qty),openTime:bj(p.time),closeTime:bj(p.closeTime),openPrice:toNum(p.price),closePrice:toNum(p.closePrice),pnl:Number((grossPnl+commission+fee+swap).toFixed(10)),source:'mt5',tz:'北京',note:{...emptyNote(),sl:ea?plan(os[0][0].sl):null,tp:ea?plan(os[0][0].tp):null},mt5:{server,account,currency:currency.trim(),position_ticket:id,symbol_raw:str(p.symbol),open_time_raw:parseTime(p.time),close_time_raw:parseTime(p.closeTime),server_utc_offset:mt5ServerOffset(server,parseTime(p.time)),beijing_offset_hours:MT5_BEIJING_UTC_OFFSET-mt5ServerOffset(server,parseTime(p.time)),gross_pnl:grossPnl,commission,fee,swap,reported_sl:toNum(p.sl),reported_tp:toNum(p.tp),entry_deal_ids:[ticket(entry[0].id)],exit_deal_ids:[ticket(exit[0].id)],order_ids:ds.map(d=>ticket(d.order)),entry_comment:comment,plan_source:ea?'confirmed EA prefix SCE2 / opening order':null}}});
  }
  return {rows,skipped:warnings.length,warnings,format:'MT5',cashflows};
}
function parseTradeFile(aoa){return isMT5(aoa)?parseMT5(aoa):parseBroker(aoa)}

function parseBackup(obj){
  const arr=Array.isArray(obj)?obj:obj.trades;if(!Array.isArray(arr))throw new Error("这不是复盘本的备份文件。");
  return {rows:arr.filter(t=>t&&t.id&&t.openTime).map(({id,...b})=>({id,body:{...withTradeTz(b),note:{...emptyNote(),...(b.note||{})}}})),skipped:0,backup:true};
}
let pendingImport=null;
$("#fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0],out=$("#impOut");if(!f)return;out.innerHTML=`<div class="note">正在读取…</div>`;
  try{
    let res;
    if(/\.json$/i.test(f.name))res=parseBackup(JSON.parse(await f.text()));
    else{
      out.innerHTML=`<div class="note">正在加载 Excel 解析组件…</div>`;
      await ensureXLSX();
      out.innerHTML=`<div class="note">正在读取交易记录…</div>`;
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:false});
      res=parseTradeFile(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""}))}
    const fresh=res.rows.filter(r=>!S.trades.has(r.id));
    const noteFill=res.backup?res.rows.filter(r=>S.trades.has(r.id)&&!reviewed(S.trades.get(r.id))&&reviewed(r.body)):[];
    const different=res.rows.filter(r=>S.trades.has(r.id)&&S.trades.get(r.id).market!==r.body.market);
    const ambiguous=res.rows.filter(r=>/[\u3400-\u9fff]/.test(r.body.marketName||"")&&/^\d+$/.test(r.body.market));
    pendingImport={fresh,noteFill,different,ambiguous};
    out.innerHTML=`${res.format?`<div class="note">已识别 MT5；时间已转北京时间。已排除 ${res.cashflows} 条非交易流水。</div>`:""}${(res.warnings||[]).map(w=>`<div class="err">${esc(w)}</div>`).join("")}<div>${res.rows.length} 笔交易，其中 <b>${fresh.length}</b> 笔是新的${res.rows.length-fresh.length?`，${res.rows.length-fresh.length} 笔已存在会跳过`:""}${noteFill.length?`；另有 ${noteFill.length} 笔会补回备注`:""}${res.skipped?`。有 ${res.skipped} 行没配对上开平仓，没有导入`:""}。</div>
      <div class="prev"><table>${res.rows.slice(0,60).map(r=>{const b=r.body,i=mkInfo(b.market),old=S.trades.has(r.id);return `<tr class="${old?"old":""}"><td style="color:${i.color};font-weight:700">${esc(i.name)}</td><td>${b.side==="long"?"多":"空"}</td><td>${md(b.openTime)} ${timezoneBadge(b)}</td><td class="num">${fmtP(b.openPrice,i.dp)}→${fmtP(b.closePrice,i.dp)}</td><td class="num ${cls(b.pnl)}">${fmtPnl(b.pnl)}</td><td>${old?"已有":"新"}</td></tr>`}).join("")}</table></div>
      ${ambiguous.map((r,i)=>`<label class="field">必须确认映射：${esc(r.id)} · ${esc(r.body.marketName)}<input data-mapping="${i}" placeholder="输入含字母的品种代码，例如 USTECH100CFD"></label>`).join("")}
      ${different.map((r,i)=>`<label class="field"><input type="checkbox" data-classification="${i}">已有但分类不同：${esc(r.id)} · ${esc(S.trades.get(r.id).market)} → ${esc(r.body.market)}（仅更新分类，另行备份确认）</label>`).join("")}
      <button class="btn primary" id="impGo" ${fresh.length||noteFill.length||different.length?"":"disabled"}>${fresh.length?`加入 ${fresh.length} 笔新交易`:noteFill.length?"补回备注":different.length?"确认分类更新":"没有需要加入的交易"}</button>`;
  }catch(err){out.innerHTML=`<div class="err">${esc(err.message||"文件读不出来，确认是券商导出的交易历史。")}</div>`;pendingImport=null}
});
$("#impOut").addEventListener("click",async e=>{
  if(e.target.id!=="impGo"||!pendingImport)return;const b=e.target;b.disabled=true;b.textContent="正在加入…";
  const {fresh,noteFill,different,ambiguous}=pendingImport;
  for(let i=0;i<ambiguous.length;i++){const code=$("#impOut").querySelector(`[data-mapping="${i}"]`).value.trim().toUpperCase();if(!/^(?=.*[A-Z])[A-Z0-9]{1,24}$/.test(code)){toast("请为未知中文品种确认有效映射，不能使用纯数字");b.disabled=false;b.textContent="确认导入";return}ambiguous[i].body.market=code}
  const selected=different.filter((r,i)=>$("#impOut").querySelector(`[data-classification="${i}"]`).checked);
  marketPause++;clearTimeout(S.fileSaveTimer);
  const r=await writeMany(fresh);
  for(const x of noteFill){try{await putNote(x.id,x.body.note)}catch(e){}}
  $("#dImport").close();
  for(const x of selected)await updateTradeMarket(x.id,x.body.market,x.body.marketName,"import-classification");
  marketPause--;await checkMarketMigration();
  pendingImport=null;$("#fileIn").value="";$("#impOut").innerHTML="";
  const quota=r.errs.some(e=>e&&e.code==="quota_exceeded");
  const fileSaved=S.fileHandle?await saveDataFile(true):false;
  toast(r.errs.length?(quota?`存储已满，${r.errs.length} 笔没加上，删掉一些旧交易再试`:`加入 ${r.done} 笔，${r.errs.length} 笔失败，再导入一次会补上`):`已加入 ${r.done} 笔新交易${fileSaved?"，并写入数据文件":""}`);
});

/* ---------- manual add ---------- */
$("#addGo").addEventListener("click",async()=>{
  const f=$("#addForm"),v=k=>f.elements[k].value,err=$("#addErr");err.textContent="";
  const ot=v("ot")?parseTime(v("ot").replace("T"," ")+(v("ot").length===16?":00":"")):null,ct=v("ct")?parseTime(v("ct").replace("T"," ")+(v("ct").length===16?":00":"")):null;
  const op=toNum(v("op")),cp=toNum(v("cp")),qty=toNum(v("qty"))||1;
  if(!ot||!ct||op==null||cp==null){err.textContent="开平仓时间和价格都要填。";return}
  if(ct<ot){err.textContent="平仓时间早于开仓时间，检查一下。";return}
  const side=v("side"),code=v("market");let pnl=toNum(v("pnl"));
  if(pnl==null)pnl=+(((side==="long"?cp-op:op-cp)*qty).toFixed(2));
  const id=tid(code,ot);if(S.trades.has(id)){err.textContent="同一时间已经有一笔这个品种的交易了。";return}
  try{await putTrade(id,{market:code,marketName:code==="XAU"?"XAU/USD":"China A50 CFD",side,qty,openTime:ot,closeTime:ct,openPrice:op,closePrice:cp,pnl,tz:v("tz"),source:"manual",note:emptyNote()});
    $("#dAdd").close();f.reset();f.elements.qty.value=1;S.openId=id;toast("已添加，可以直接写复盘")}
  catch(e){err.textContent=e&&e.code==="quota_exceeded"?"存储已满，删掉一些旧交易再添加。":"添加失败，请重试。"}
});

  const d=new Date();

});

/* ---------- snapshot as single HTML ---------- */
async function exportSelfContainedHTML(){
  // Browser security prevents silently overwriting the HTML file currently open.
  // Export a fresh, standalone snapshot with latest data embedded in its script.
  if(S.openId)await flush(S.openId);
  const copy=document.documentElement.cloneNode(true);
  for(const external of copy.querySelectorAll('script[src]'))external.remove();
  const scripts=[...copy.querySelectorAll('script:not([src])')];
  const main=scripts.find(s=>s.textContent.includes('const SEED='));
  if(!main)throw new Error('没有找到交易数据代码');
  const latest=JSON.stringify(normalizedTrades()).replace(/</g,'\\u003c');
  const stamp=new Date();
  const revision=stamp.toISOString().replace(/\D/g,'').slice(0,14)+'-'+S.trades.size;
  let code=main.textContent;
  const pos=code.indexOf('const SEED=');
  const end=code.indexOf('\nconst SEED_REV=',pos);
  if(pos<0||end<0)throw new Error('找不到嵌入数据位置');
  code=code.slice(0,pos)+'const SEED='+latest+';'+code.slice(end);
  code=code.replace(/const SEED_REV="[^"]*";/,'const SEED_REV="'+revision+'";');
  main.textContent=code;
  // Strip transient runtime state; original boot() reconstructs these regions.
  for(const sel of ['#mkSeg','#memory','#stats','#list','#lib','#impOut','#modeNote','#fileState']){
    const el=copy.querySelector(sel);if(el)el.innerHTML='';
  }
  for(const d of copy.querySelectorAll('dialog'))d.removeAttribute('open');
  const list=copy.querySelector('#vList'),lib=copy.querySelector('#vLib');
  list?.classList.remove('hidden');lib?.classList.add('hidden');
  for(const b of copy.querySelectorAll('#viewSeg button'))b.setAttribute('aria-pressed',b.dataset.v==='list'?'true':'false');
  for(const b of copy.querySelectorAll('#sideSeg button'))b.setAttribute('aria-pressed',b.dataset.side==='ALL'?'true':'false');
  const fileSave=copy.querySelector('#bSaveData');fileSave?.classList.add('hidden');
  const exportBtn=copy.querySelector('#bExport');exportBtn?.classList.add('hidden');
  const toastCopy=copy.querySelector('#toast');if(toastCopy){toastCopy.textContent='';toastCopy.classList.remove('on')}
  const html='<!doctype html>\n'+copy.outerHTML;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download='复盘本-含数据-'+stamp.getFullYear()+pad(stamp.getMonth()+1)+pad(stamp.getDate())+'.html';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  toast('已下载包含 '+S.trades.size+' 笔交易的 HTML 快照');
}
$('#bExportHTML').addEventListener('click',()=>exportSelfContainedHTML().catch(e=>toast('导出失败：'+(e.message||'未知错误'))));

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}

boot().catch(err=>{console.error(err);bootStage("加载遇到问题，正在进入复盘本");setTimeout(bootDone,500);toast("启动时有一项加载失败，已使用本地数据继续")});
